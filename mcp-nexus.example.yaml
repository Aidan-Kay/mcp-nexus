port: 8050

# Every key below is checked: one this file does not list is a startup error, not ignored.

auth:
  enabled: false # Set to true in production
  # Tokens never go in this file. MCP_NEXUS_AUTH_TOKEN is the shared token (client
  # `default`); MCP_NEXUS_TOKEN_<NAME> gives a client its own (MCP_NEXUS_TOKEN_LYRA is
  # client `lyra`), so the call log can say who called and a policy can apply to it.
  allowedOrigins: # Optional — restrict CORS to these origins when auth is on
    - https://openwebui.local
  # clients: # Optional — what each client may call. A client without an entry may call anything.
  #   lyra:
  #     deny: ["ebay__ebay_issue_refund"] # Globs over namespaced tool names; hidden and refused
  #     confirm: ["ebay__ebay_end_*"] # These need a confirmed second call
  #     confirmDestructive: true # ...as does every tool its service marks destructiveHint: true
  #   n8n:
  #     allow: ["todoist__*"] # When set, only these are visible or callable

connectors:
  httpReuseIdleTimeoutSeconds: 300 # Reap idle upstream HTTP sessions after N seconds
  recoveryIntervalSeconds: 30 # Probe failed sources every N seconds (0 = disabled)
  maxResponseBytes: 33554432 # Abandon an upstream response larger than this (32 MB)

search:
  type: lexical # "lexical" (keyword matching), "semantic" (embedding-based) or "hybrid" (both fused)
  maxResults: 20 # Max results returned by search_tools
  # semantic: # Uncomment to enable semantic search
  #   provider: built-in # "built-in" (local model), "ollama", or "openai-compatible"
  #   model: Xenova/all-MiniLM-L6-v2 # Model name (provider-specific)
  #   batchSize: 32 # Batch size for embedding generation at index time
  #   modelCachePath: /app/data/model-cache # Where to cache the model (built-in only)
  #   minSimilarity: 0.25 # Similarity a tool needs to be returned at all (model-specific)
  #   # For ollama:
  #   # provider: ollama
  #   # baseUrl: http://ollama:11434
  #   # model: nomic-embed-text
  #   # For openai-compatible:
  #   # provider: openai-compatible
  #   # baseUrl: https://api.openai.com
  #   # model: text-embedding-3-small
  #   # apiKeyEnv: OPENAI_API_KEY # Name of env var containing the API key

# artefacts: # Uncomment to let call_tool write results to files instead of returning them.
#   root: /data/artefacts # Every artefact lives under here; nexus owns the paths below it
#   retentionDays: 14 # Delete run directories older than this (0 = never)
#   runIdleMinutes: 180 # How long one label keeps writing into the same run directory
#   maxBytes: 33554432 # Refuse to write a single artefact larger than this (32 MB)
#
# Whatever executes code against these files must see the same absolute path —
# mount the same volume at the same location in both containers.

sources:
  - id: todoist
    name: Todoist
    description: Task and project management
    transport: http
    url: http://todoist-mcp:8081/mcp
    filter: ["*"] # Glob patterns — only index matching tools

  - id: outlook
    name: Outlook
    description: Email and calendar
    transport: stdio
    command: npx
    args: ["-y", "@softeria/ms-365-mcp-server"]
    env:
      API_KEY: "your-key"
    preloadedTools:
      - search-emails
      - list-folders

  - id: ebay
    name: eBay
    description: Marketplace listings and orders
    transport: http
    url: http://ebay-mcp:8086/mcp
    # allowUnknownArguments: true # Only for a service whose tools take keys their schemas do not declare
